<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .image-container {
            max-width: 90%;
            max-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .centered-image {
            max-width: 100%;
            max-height: 100vh;
            height: auto;
            width: auto;
            border: 8px solid white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        @media (max-width: 768px) {
            .centered-image {
                border-width: 5px;
            }
        }

        @media (max-width: 480px) {
            .centered-image {
                border-width: 3px;
            }
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img 
            src="images/Prank.jpg?height=800&width=1200"
            class="centered-image"
        >
    </div>
</body>
</html>
